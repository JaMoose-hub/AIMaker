# Raspberry Pi 5 only - kept as its own dataset/model, separate from
# datasets/board-pose (Arduino UNO Q). Do not merge the two image sets.
# Relative path is resolved against this YAML by tools/train_yolo_board_pose.py.
path: ../datasets/board-pose-pi5
train: images/train
val: images/val
test: images/test

kpt_shape: [4, 3]
names:
  0: raspberry-pi-5
kpt_names:
  0:
    - profile_TL
    - profile_TR
    - profile_BR
    - profile_BL
