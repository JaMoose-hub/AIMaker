# HC-SR04 production Pose dataset derived from the reviewed v2 labels.
# Runtime learns the four semantic PCB corners and projects VCC/TRIG/ECHO/GND
# from profiles/components/hc-sr04/vision_profile.json, matching the stable
# photoresistor component pipeline.
path: ../datasets/hc-sr04-corner-pose-v2
train: images/train
val: images/val
test: images/test

kpt_shape: [4, 3]
names:
  0: hc-sr04
kpt_names:
  0:
    - pcb_TL
    - pcb_TR
    - pcb_BR
    - pcb_BL
