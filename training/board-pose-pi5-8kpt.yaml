# Raspberry Pi 5 markerless 8-point pose dataset. The original 104/35
# four-point dataset remains untouched under datasets/board-pose-pi5.
path: ../datasets/board-pose-pi5-8kpt
train: images/train
val: images/val
test: images/test

kpt_shape: [8, 3]
names:
  0: raspberry-pi-5
kpt_names:
  0:
    - board_TL
    - board_TR
    - board_BR
    - board_BL
    - J8_P1
    - J8_P2
    - J8_P40
    - J8_P39
